# Single entry point: checks run on every push and PR, and a push to main that
# passes them all deploys. Keeping the gate here rather than in the deploy
# workflow means there is no way to reach production without passing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --frozen fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change that was never locked cannot reach the server.
      - run: uv sync --frozen
      - run: uv run pytest -q

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The deploy scripts run as root on the server; a typo there is expensive.
      - run: shellcheck deploy/*.sh

  deploy:
    name: Deploy
    needs: [lint, test, shellcheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
