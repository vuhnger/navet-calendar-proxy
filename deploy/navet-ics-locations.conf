# The public URL surface, included once from the site's server block.
#
# This lives in a snippet rather than inline in nginx.conf because certbot
# rewrites nginx.conf in place — it moves the whole server block to :443 and
# adds its own directives — so a deploy can never safely copy that file over the
# server's copy. It *can* safely replace this one, which is what
# server-deploy.sh does. Adding a route to the app therefore means editing this
# file and nothing else.
#
# Every path is listed explicitly. The app serves nothing else today, but an
# allowlist means a future route is not exposed by accident: adding one here is
# a deliberate act.

location = /calendar.ics {
    proxy_pass http://127.0.0.1:8000/calendar.ics;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = /registrations.ics {
    proxy_pass http://127.0.0.1:8000/registrations.ics;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = /jobs.ics {
    proxy_pass http://127.0.0.1:8000/jobs.ics;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

# Atom feed of new job listings, for feed readers.
location = /jobs.xml {
    proxy_pass http://127.0.0.1:8000/jobs.xml;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

# The read-only JSON API. A prefix rather than an exact match, because the
# collection endpoints have per-record children (/api/events/<id>).
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

# API documentation. Swagger UI and ReDoc pull their JavaScript from a public
# CDN, so these pages need outbound network access from the *browser*, not from
# the server.
location = /docs {
    proxy_pass http://127.0.0.1:8000/docs;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = /redoc {
    proxy_pass http://127.0.0.1:8000/redoc;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = /openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8000/healthz;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = /readyz {
    proxy_pass http://127.0.0.1:8000/readyz;
    include /etc/nginx/snippets/navet-ics-proxy.conf;
}

location = / {
    return 302 /calendar.ics;
}

# Nothing else is served.
location / {
    return 404;
}
