# Shared proxy settings for all upstream locations.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# The app serves from memory, so anything slow means it is unhealthy.
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;

# Serve the last response if the app is restarting rather than erroring out:
# a subscriber that gets an error keeps its events, one that gets an empty
# calendar archives them.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_buffering on;
