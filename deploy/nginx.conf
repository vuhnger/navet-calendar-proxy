# Public entry point for the Navet calendar proxy.
#
# This file defines the plain-HTTP site only. `certbot --nginx --redirect` adds
# the TLS server block and turns this one into a redirect to HTTPS, so do not
# hand-write a second :80 block here — two blocks with the same server_name make
# nginx silently ignore one of them.

# Rate limit by client IP. A subscriber polls at most a few times an hour, so
# this is generous for real clients and still blunts abuse.
limit_req_zone $binary_remote_addr zone=navet_ics:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=navet_ics_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_PLACEHOLDER;

    access_log /var/log/nginx/navet-ics.access.log;
    error_log  /var/log/nginx/navet-ics.error.log warn;

    limit_req zone=navet_ics burst=20 nodelay;
    limit_conn navet_ics_conn 16;

    # The feed is public read-only data; nothing here accepts input.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Certbot renews unattended over HTTP-01; this must stay reachable on :80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Calendar clients only ever read.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /calendar.ics {
        proxy_pass http://127.0.0.1:8000/calendar.ics;
        include /etc/nginx/snippets/navet-ics-proxy.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        include /etc/nginx/snippets/navet-ics-proxy.conf;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8000/readyz;
        include /etc/nginx/snippets/navet-ics-proxy.conf;
    }

    location = / {
        return 302 /calendar.ics;
    }

    # Nothing else is served.
    location / {
        return 404;
    }
}
