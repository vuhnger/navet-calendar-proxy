[project]
name = "navet-calendar-proxy"
version = "1.0.0"
description = "Exposes ifinavet.no events as a subscribable iCalendar feed"
readme = "README.md"
requires-python = ">=3.11"
# Pinned exactly; uv.lock records the resolved graph and hashes on top of this.
dependencies = [
    "fastapi==0.121.2",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "icalendar==6.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navet_ics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
